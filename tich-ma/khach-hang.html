<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu mã tích điểm</title>
    <link rel="stylesheet" href="tich-ma.css">
</head>
<body>
<header>
    <h1>Tích mã – Thành viên nhóm Zalo</h1>
    <p><a href="../index.html">← Về trang chủ</a></p>
</header>
<main>
    <section class="the">
        <h2 style="margin-top:0">Cách nhận khuyến mãi</h2>
        <ol>
            <li>Tham gia nhóm Zalo của quán.</li>
            <li>Mỗi lần đến mua, báo nhân viên số điện thoại để được cấp <b>1 mã</b>.</li>
            <li>Gom đủ <b id="soMaDoi">5</b> mã → nhận <b id="phanThuong">khuyến mãi</b>.</li>
        </ol>
        <p class="goi-y" id="hanDung"></p>
    </section>

    <section class="the">
        <label for="sdt">Số điện thoại của bạn</label>
        <input id="sdt" type="tel" inputmode="numeric" placeholder="0907754132">
        <button id="btnTra">Xem số mã đã tích</button>
        <div id="kq"></div>
    </section>
</main>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

goiApi({ action: 'cau_hinh' }).then((ch) => {
    $('soMaDoi').textContent = ch.so_ma_doi;
    $('phanThuong').textContent = ch.phan_thuong;
    if (ch.han_su_dung_ngay > 0) $('hanDung').textContent = 'Mỗi mã có hạn ' + ch.han_su_dung_ngay + ' ngày kể từ ngày cấp.';
}).catch(() => { /* vẫn hiện nội dung mặc định */ });

$('btnTra').onclick = async () => {
    const nut = $('btnTra');
    nut.disabled = true;
    $('kq').innerHTML = '<p class="goi-y">Đang tra cứu…</p>';
    try {
        const kq = await goiApi({ action: 'tra_cuu', sdt: $('sdt').value });
        const pt = Math.min(100, Math.round(kq.so_ma / kq.so_ma_doi * 100));
        let html = '<p>SĐT ' + esc(kq.sdt) + ' đang có <b>' + kq.so_ma + '/' + kq.so_ma_doi + '</b> mã.</p>' +
            '<div class="thanh"><div style="width:' + pt + '%"></div></div>';
        html += kq.du_doi
            ? '<p class="ok">🎉 Bạn đã đủ mã để nhận: ' + esc(kq.phan_thuong) + '. Lần tới đến quán báo nhân viên để đổi nhé!</p>'
            : '<p>Gom thêm <b>' + (kq.so_ma_doi - kq.so_ma) + '</b> mã nữa để nhận: ' + esc(kq.phan_thuong) + '.</p>';
        if (kq.danh_sach.length) {
            html += '<table><tr><th>Mã</th><th>Ngày cấp</th><th>Hết hạn</th></tr>' +
                kq.danh_sach.map((x) => '<tr><td>' + esc(x.ma) + '</td><td>' + esc(x.ngay_cap) + '</td><td>' + esc(x.het_han || '—') + '</td></tr>').join('') +
                '</table>';
        }
        $('kq').innerHTML = html;
    } catch (err) {
        $('kq').innerHTML = '<p class="loi">' + esc(err.message) + '</p>';
    } finally {
        nut.disabled = false;
    }
};
</script>
</body>
</html>
